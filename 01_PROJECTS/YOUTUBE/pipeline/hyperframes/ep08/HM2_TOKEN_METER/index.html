<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<!-- EP08 Scene 37 · HM2_TOKEN_METER · 10.98 s · beats (rel): 0 / 2.84 / 6.26 · token count ILLUSTRATIVE; pairs = tokens² (exact) -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  @font-face { font-family: "Nohemi"; src: url("assets/fonts/Nohemi-Medium.ttf"); font-weight: 500; }
  @font-face { font-family: "Nohemi"; src: url("assets/fonts/Nohemi-Bold.ttf"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #202322; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #202322;
    font-family: "Nohemi", "Inter", "Segoe UI", system-ui, sans-serif; font-weight: 500; color: #E6EDF3;
    font-variant-numeric: tabular-nums; }
  .grid { position: absolute; left: -120px; top: -120px; width: 2160px; height: 1320px; opacity: 0.22;
    background-image: linear-gradient(#233D4C 1px, transparent 1px), linear-gradient(90deg, #233D4C 1px, transparent 1px);
    background-size: 120px 120px; }
  #win { position: absolute; left: 160px; top: 214px; width: 1600px; height: 620px; border: 1px solid #233D4C; background: #202322; }
  .bar { position: absolute; left: 0; top: 0; width: 100%; height: 64px; border-bottom: 1px solid #233D4C; }
  .dot { position: absolute; top: 24px; width: 16px; height: 16px; border-radius: 50%; background: #233D4C; }
  .title { position: absolute; left: 120px; top: 16px; font-size: 28px; font-weight: 700; letter-spacing: 0.12em; opacity: 0.7; }
  #tag { position: absolute; right: 28px; top: 16px; font-size: 28px; font-weight: 700; letter-spacing: 0.12em; color: #FD802E; }
  .lbl { position: absolute; font-size: 28px; letter-spacing: 0.12em; opacity: 0.7; white-space: nowrap; }
  #doc { position: absolute; left: 60px; top: 140px; width: 660px; height: 440px; border: 1px solid #233D4C; overflow: hidden; }
  #lines { position: absolute; left: 28px; top: 24px; width: 604px; }
  .ln { height: 14px; margin-bottom: 18px; background: #E6EDF3; opacity: 0.28; }
  .num { position: absolute; font-weight: 700; line-height: 1; white-space: nowrap; }
  #tok { left: 820px; top: 140px; font-size: 104px; }
  #pairs { left: 820px; top: 312px; font-size: 72px; }
  .track { position: absolute; left: 1060px; width: 480px; height: 26px; background: rgba(35, 61, 76, 0.7); }
  .fill { position: absolute; left: 0; top: 0; width: 100%; height: 26px; background: #FD802E; transform-origin: 0 50%; }
  #ph { position: absolute; left: 1190px; top: 270px; font-size: 28px; color: #FD802E; white-space: nowrap; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10.98" data-width="1920" data-height="1080">
  <div class="grid clip" id="grid" data-start="0" data-duration="10.98" data-track-index="0"></div>
  <div id="win">
    <div class="bar"><div class="dot" style="left:24px"></div><div class="dot" style="left:52px"></div><div class="dot" style="left:80px"></div>
      <div class="title">CONTEXT WINDOW</div><div id="tag">ILLUSTRATIVE</div></div>
    <div class="lbl" style="left:60px; top:96px">PROMPT</div>
    <div id="doc"><div id="lines" data-layout-allow-overflow></div></div>
    <div class="lbl" id="tlbl" style="left:820px; top:96px">TOKENS</div>
    <div class="num" id="tok">0</div>
    <div class="lbl" id="plbl" style="left:820px; top:270px">PAIRS = TOKENS²</div>
    <div id="ph">per head, per layer</div>
    <div class="num" id="pairs">0</div>
    <div class="lbl" id="l1" style="left:820px; top:440px">LATENCY</div>
    <div class="track" id="t1" style="top:442px"><div class="fill" id="f1"></div></div>
    <div class="lbl" id="l2" style="left:820px; top:510px">COST</div>
    <div class="track" id="t2" style="top:512px"><div class="fill" id="f2"></div></div>
  </div>
</div>
<script>
  const D = 10.98, B = [0, 2.84, 6.26];
  // deterministic line widths (seeded LCG)
  let seed = 37; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const lines = document.getElementById("lines");
  const LN = [];
  for (let i = 0; i < 40; i++) {
    const d = document.createElement("div"); d.className = "ln";
    d.style.width = (i % 7 === 6 ? 30 + rnd() * 25 : 72 + rnd() * 28) + "%";
    lines.appendChild(d); LN.push(d);
  }
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#grid", { x: 0, y: 0 }, { x: 120, y: 60, duration: D, ease: "none" }, 0);
  gsap.set(LN, { opacity: 0 });
  gsap.set(["#tag", "#tlbl", "#tok", "#plbl", "#pairs", "#ph", "#l1", "#l2", "#t1", "#t2"], { opacity: 0 });

  // b1 — the prompt box fills with a long document, and keeps growing
  tl.from("#win", { opacity: 0, scale: 0.97, duration: 0.6, ease: "power2.out" }, 0);
  tl.from(".title", { opacity: 0, x: -20, duration: 0.5, ease: "power2.out" }, 0.3);
  tl.to(LN, { opacity: 0.28, duration: 0.15, ease: "none", stagger: 0.17 }, 0.4);
  tl.fromTo("#lines", { y: 0 }, { y: -(40 * 32 - 400), duration: 9.6 - 2.6, ease: "power1.inOut" }, 2.6);

  // b2 — token counter climbs; pairs = tokens²
  const tok = document.getElementById("tok"), pairs = document.getElementById("pairs"), st = { v: 0 };
  tl.to(["#tag", "#tlbl", "#tok", "#plbl", "#pairs"], { opacity: 1, duration: 0.4, ease: "power2.out" }, B[1]);
  tl.to(st, { v: 8000, duration: 3.2, ease: "power1.inOut", onUpdate: () => {
    const n = Math.round(st.v); tok.textContent = n.toLocaleString("en-US"); pairs.textContent = (n * n).toLocaleString("en-US"); } }, B[1] + 0.1);

  // b3 — latency and cost meters rise, final readout
  tl.to(["#l1", "#t1"], { opacity: 1, duration: 0.35, ease: "power2.out" }, B[2]);
  tl.fromTo("#f1", { scaleX: 0 }, { scaleX: 0.92, duration: 1.6, ease: "power2.inOut" }, B[2] + 0.1);
  tl.to(["#l2", "#t2"], { opacity: 1, duration: 0.35, ease: "power2.out" }, B[2] + 0.5);
  tl.fromTo("#f2", { scaleX: 0 }, { scaleX: 0.88, duration: 1.6, ease: "power2.inOut" }, B[2] + 0.6);
  tl.to("#pairs", { color: "#FD802E", duration: 0.4, ease: "power2.inOut" }, 8.6);
  tl.fromTo("#ph", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 8.7);
  tl.to({}, { duration: 0.01 }, D - 0.01); // final frame held from ~9.6 s

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
