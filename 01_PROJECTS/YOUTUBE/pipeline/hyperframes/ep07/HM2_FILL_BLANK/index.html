<script>
  const D = 9.74, B = [0, 3.74, 5.54, 8.12];
  const typed = document.getElementById("typed");
  const chars = typed.textContent.split(""); typed.textContent = "";
  const spans = chars.map(ch => { const s = document.createElement("span"); s.textContent = ch; s.style.opacity = 0; typed.appendChild(s); return s; });

  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#grid", { x: 0, y: 0 }, { x: 120, y: 60, duration: D, ease: "none" }, 0);
  gsap.set(["#tag", "#hdr", ".row", "#blank"], { opacity: 0 });

  // b1 — prompt types, blank cursor blinks
  tl.from("#win", { opacity: 0, scale: 0.97, duration: 0.6, ease: "power2.out" }, 0);
  tl.from(".title", { opacity: 0, x: -20, duration: 0.5, ease: "power2.out" }, 0.3);
  spans.forEach((s, i) => tl.set(s, { opacity: 1 }, 0.5 + i * 0.07));
  const tBlank = 0.5 + spans.length * 0.07;
  tl.to("#blank", { opacity: 1, duration: 0.3, ease: "power2.out" }, tBlank);
  for (let t = tBlank + 0.5, k = 0; t < D - 0.6; t += 0.5, k++) tl.set("#cur", { opacity: k % 2 ? 1 : 0 }, t);

  // value counters
  function countUp(row, at, dur) {
    const el = document.querySelector(row + " .v"), target = parseFloat(el.dataset.v), st = { v: 0 };
    tl.to(st, { v: target, duration: dur, ease: "power2.out", onUpdate: () => { el.textContent = st.v.toFixed(2); } }, at);
  }
  function showRow(row, at) {
    tl.fromTo(row, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, at);
    tl.fromTo(row + " .fill", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.inOut" }, at + 0.15);
  }
  // b2 — candidate panel, first bar
  tl.to(["#hdr", "#tag"], { opacity: 0.8, duration: 0.4, ease: "power2.out" }, B[1]);
  showRow("#r0", B[1] + 0.2); countUp("#r0", B[1] + 0.35, 0.9);
  // b3 — tea, cocoa
  showRow("#r1", B[2]); countUp("#r1", B[2] + 0.15, 0.9);
  showRow("#r2", B[2] + 0.9); countUp("#r2", B[2] + 1.05, 0.9);
  // b4 — banana: near-zero, Pumpkin
  showRow("#r3", B[3]);
  tl.to("#r0 .w", { color: "#C3D809", duration: 0.4, ease: "power2.inOut" }, B[3] + 0.3);
  tl.to({}, { duration: 0.01 }, D - 0.01); // final frame held from ~9.1 s

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
